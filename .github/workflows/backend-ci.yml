name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: famtree_test
          POSTGRES_USER: famtree
          POSTGRES_PASSWORD: famtree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U famtree -d famtree_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://famtree:famtree_test@localhost:5432/famtree_test
      SESSION_SECRET: ci-only-secret
      RUN_DATABASE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate migrations
        run: alembic upgrade head
      - name: Detect model and migration drift
        run: alembic check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy app tests
      - name: Tests and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Bandit
        run: bandit -c pyproject.toml -r app
      - name: Dependency audit
        run: pip-audit --require-hashes -r requirements.lock
