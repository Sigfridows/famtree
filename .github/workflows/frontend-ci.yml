name: FamTree Frontend CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'front-end/**'
  push:
    branches: [ main ]
    paths:
      - 'front-end/**'

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configura Node.js con caché de npm
      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./front-end/package-lock.json

      # 3. Instala dependencias del frontend
      - name: Instalar dependencias
        working-directory: ./front-end
        run: npm ci

      # 4. Compila la aplicación Next.js
      # (Next.js valida automátiamente TypeScript, ESLint y Tailwind durante el build)
      - name: Compilar aplicación Next.js
        working-directory: ./front-end
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      # 5. Ejecuta las pruebas del frontend (si están configuradas)
      - name: Correr Pruebas del Frontend
        working-directory: ./front-end
        run: npm run test --if-present